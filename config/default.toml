# shtty v0.5 configuration file.
#
# Place at: ~/.config/shtty/config.toml (XDG) or /etc/shtty/config.toml (system-wide)
#
# Все биндинги и настройки задаются здесь. Нет захардкоденных значений.
#
# === Privilege Separation Model ===
# При запуске от root процесс делает следующее:
#   1. Открывает DRM master fd и /dev/input/event* (нужен root)
#   2. fork() — ребёнок drop к "shtty" user, показывает login screen
#      (непривилегированный — не может читать /etc/shadow, не имеет IPC)
#   3. Родитель (root) принимает credentials через socketpair, делает PAM auth
#   4. При успехе — родитель drop к вошедшему пользователю, запускает WM + IPC
#   5. IPC сокет создаётся с правами 0600 + SO_PEERCRED проверкой —
#      только вошедший пользователь может отправлять команды
#
# Системный пользователь "shtty" создаётся install.sh.
# Он состоит в группах: video, input, render, tty (но НЕ shadow).

[general]
shell = "zsh"
# Имя шрифта — информационное поле. Реальный шрифт ищется через fontconfig:
#   1. /etc/shtty/font.ttf — пользовательский TTF (если есть)
#   2. fc-match monospace:spacing=100 — системный monospace TTF (DejaVu Sans Mono,
#      JetBrains Mono, Source Code Pro, etc.)
#   3. PSF fallback (ter-u16n.psfu.gz и т.д.)
# Для установки хорошего шрифта:
#   Arch:    sudo pacman -S ttf-dejavu ttf-jetbrains-mono ttf-nerd-fonts-symbols
#   Debian:  sudo apt install fonts-dejavu fonts-jetbrains-mono
# Или скопируй любой .ttf в /etc/shtty/font.ttf чтобы переопределить.
font = "DejaVu Sans Mono"
font_size = 16
gap = 4
border = 1
outer_padding = 4
status_bar_height = 24
framerate = 60
workspace_count = 10  # 1..9 + 0=10

[theme]
bg = "#0A0716"
tile_bg_inactive = "#120E24"
tile_bg_active = "#0F0A1E"
border_inactive = "#3A2D5C"
border_active = "#FF2E97"
border_x11 = "#00F0FF"
fg_default = "#E6E1F0"
fg_dim = "#7A6F96"
accent_magenta = "#FF2E97"
accent_cyan = "#00F0FF"
popup_bg = "#140B2E"
popup_border = "#FF2E97"
error = "#FF4D4D"

# ===== Login screen =====
# Простой вход: логин → Enter → пароль → Enter.
[login]
# Заголовок на экране логина (пусто = "SHTTY" / подзаголовок "Tiling Window Manager")
title = ""
subtitle = ""
language = "en"            # язык подписей: "en" / "ru"
show_clock = true
show_hint = true
pam_service = "login"
auto_start_session = true
# title_color = "#FF2E97"  # optional override (default = theme.accent_magenta)
# title_font = ""          # optional override (default = general.font)

# ===== Workspaces =====
# 10 workspaces (1..9 + 0=10). Каждый может иметь имя и on_init команду.
[[workspaces]]
n = 1
name = "MAIN"

[[workspaces]]
n = 2
name = "WEB"

[[workspaces]]
n = 3
name = "DEV"

[[workspaces]]
n = 4
name = "CHAT"

[[workspaces]]
n = 5
name = "MEDIA"

[[workspaces]]
n = 6
name = "6"

[[workspaces]]
n = 7
name = "7"

[[workspaces]]
n = 8
name = "8"

[[workspaces]]
n = 9
name = "9"

[[workspaces]]
n = 10
name = "MISC"

# ===== Monitors (multi-monitor setup) =====
# Привязка workspaces к конкретным мониторам (как в Hyprland).
# Если мониторов несколько — каждый имеет свой набор workspaces.
# Если конфиг пустой — все workspaces на primary monitor.

[[monitors]]
connector = "eDP-1"          # встроенный экран ноутбука
workspaces = [1, 3, 5, 7, 9] # нечётные
enabled = true
position = "primary"

[[monitors]]
connector = "HDMI-A-1"       # внешний HDMI
workspaces = [2, 4, 6, 8, 10] # чётные
enabled = true
position = "right-of eDP-1"

# [[monitors]]
# connector = "DP-1"
# workspaces = [1, 2, 3]
# resolution = [2560, 1440]
# refresh_rate = 144
# enabled = true
# position = "left-of eDP-1"

# ===== Window rules =====
# Автоматическое размещение окон по правилам (при CreateNotify в X11).
# Все непустые поля match_* должны совпасть (AND). Поле regex включает regex-матчинг.
[[window_rules]]
match_class = "Steam"
workspace = 5                  # Steam games → workspace 5 (MEDIA)
focus = true
fullscreen = false

[[window_rules]]
match_class = "firefox"
workspace = 2                  # браузер → WEB

[[window_rules]]
match_class = "discord"
workspace = 4                  # Discord → CHAT
focus = true

[[window_rules]]
match_class = "Gimp"
workspace = 5
size = [80, 80]                # 80% ширины и высоты
position = [10, 10]

[[window_rules]]
match_class = "Spotify"
workspace = 5

# ===== Autostart =====
# Команды запускаемые при старте WM (после login).
# type: "x11" (графическая), "terminal" (в нашем терминале), "command" (фоновый процесс)
[[autostart]]
type = "command"
cmd = "pipewire"
delay_ms = 0

[[autostart]]
type = "command"
cmd = "pipewire-pulse"
delay_ms = 500

[[autostart]]
type = "command"
cmd = "wireplumber"
delay_ms = 1000

[[autostart]]
type = "x11"
cmd = "firefox"
args = []
delay_ms = 2000
workspace = 2                  # открыть на workspace 2 (WEB)

[[autostart]]
type = "x11"
cmd = "discord"
args = []
delay_ms = 3000
workspace = 4                  # открыть на workspace 4 (CHAT)

[[autostart]]
type = "terminal"
cmd = "htop"
args = []
delay_ms = 0
workspace = 1                  # открыть на workspace 1 (MAIN)

# ===== Popups =====
[popups]
duration_frames = 240          # 4 секунды при 60fps
max_width_pct = 67
# font = "Lat2-Terminus16"     # optional override

# ===== Status Bar (polybar/waybar-style) =====
# Полностью настраиваемая нижняя (или верхняя) панель. Все элементы
# настраиваются здесь — никаких захардкоженных надписей.
#
# Параметры [bar]:
#   enabled       — показывать панель или нет
#   position      — "top" или "bottom"
#   height        — высота в пикселях
#   bg            — цвет фона (hex "#RRGGBB"). Пусто = встроенный тёмный.
#   fg            — цвет текста по умолчанию. Пусто = theme.fg_default.
#   active_bg     — фон активного элемента (например активного workspace).
#   active_fg     — текст активного элемента.
#   separators    — показывать разделитель между модулями.
#   separator     — символ разделителя.
#
# Модули ([[bar.modules]]):
#   name        — уникальное имя (для логов)
#   type        — тип: workspaces | clock | cpu | memory | battery |
#                        network | text | custom
#   position    — позиция в bar: "left" / "center" / "right"
#   format      — формат вывода (см. ниже для каждого типа)
#   color       — цвет текста (hex). Пусто = bar.fg
#   refresh_ms  — интервал обновления в мс (для динамических модулей).
#                 0 = каждый кадр (не рекомендуется для custom).
#   cmd         — для custom: команда для запуска.
#                 для text: статичный текст.
#   args        — для custom: аргументы команды.
#   max_len     — максимальная длина вывода (обрезается с "...").
#
# Формат по типам:
#   workspaces: "{n}" (номер), "{name}" (имя), "{n}:{name}" (по умолчанию)
#   clock:      strftime format — "%H:%M", "%H:%M:%S", "%Y-%m-%d %H:%M"
#   cpu:        "{percent}" (например "CPU {percent}%")
#   memory:     "{percent}"
#   battery:    "{percent}"
#   network:    "{iface}" (интерфейс), "{ip}" (IPv4 адрес)
#   text:       игнорируется (используйте cmd как содержимое)
#   custom:     "{}" подставляется stdout команды, или используйте
#                произвольную строку с "{}"
[bar]
enabled = true
position = "bottom"            # "top" или "bottom"
height = 24
# bg = "#0A0716"               # empty = use built-in dark
# fg = "#E6E1F0"               # empty = use theme.fg_default
# active_bg = "#FF2E97"        # active workspace background
# active_fg = "#FFFFFF"        # active workspace foreground
separators = false
separator = " | "

# Слева: workspaces + имя хоста
[[bar.modules]]
name = "ws"
type = "workspaces"
position = "left"
format = "{n}:{name}"
refresh_ms = 0

[[bar.modules]]
name = "hostname"
type = "text"
position = "left"
cmd = "archlinux"             # статичный текст
color = "#00F0FF"

# Центр: CPU и RAM
[[bar.modules]]
name = "cpu"
type = "cpu"
position = "center"
format = "CPU {percent}%"
color = "#FF2E97"
refresh_ms = 2000

[[bar.modules]]
name = "mem"
type = "memory"
position = "center"
format = "RAM {percent}%"
color = "#FF2E97"
refresh_ms = 2000

# Справа: сеть + батарея + часы
[[bar.modules]]
name = "net"
type = "network"
position = "right"
format = "{iface} {ip}"
refresh_ms = 5000

[[bar.modules]]
name = "bat"
type = "battery"
position = "right"
format = "BAT {percent}%"
refresh_ms = 5000

[[bar.modules]]
name = "clock"
type = "clock"
position = "right"
format = "%H:%M"              # strftime — время в UTC. Для localtime используйте
                                # custom модуль с cmd = "date +%H:%M"
color = "#00F0FF"
refresh_ms = 1000

# ===== Key bindings =====
# Все биндинги в конфиге. Нет захардкоженных.
